services:
  db:
    image: postgres:16-alpine
    container_name: horas-extras-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - horas-extras-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports": la base de datos solo es alcanzable dentro de la red
    # interna de este compose, nunca desde fuera del host.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: horas-extras-app:latest
    container_name: horas-extras-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8090:8090"

volumes:
  horas-extras-db-data:
