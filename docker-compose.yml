services:
  db:
    image: postgres:16-alpine
    container_name: horas-extras-db${STACK_SUFFIX:-}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - horas-extras-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports": la base de datos solo es alcanzable dentro de la red
    # interna de este compose, nunca desde fuera del host.

  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: horas-extras-db-backup${STACK_SUFFIX:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=14
      - BACKUP_KEEP_WEEKS=8
      - BACKUP_KEEP_MONTHS=6
    # Respaldo diario comprimido a ./backups (fuera del volumen de "db", para
    # que un problema con el volumen no se lleve tambien el backup). Mismo
    # esquema que ya usan para el backup de Supabase en este servidor.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: horas-extras-app${STACK_SUFFIX:-}:latest
    container_name: horas-extras-app${STACK_SUFFIX:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Solo lectura - para que el job diario pueda avisar cuando el
      # certificado este por vencer (ver src/jobs/alertaVencimientoCredenciales.js).
      - ./certs:/app/certs:ro
    # Sin "ports": solo es alcanzable desde "nginx" dentro de la red interna
    # de este compose. El HTTPS publico lo termina nginx (ver mas abajo).

  nginx:
    image: nginx:1.27-alpine
    container_name: horas-extras-nginx${STACK_SUFFIX:-}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - APP_UPSTREAM=app:${PORT:-8090}
    volumes:
      - ./deploy/docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTPS_PORT:-8443}:443"
      - "${NGINX_HTTP_PORT:-8081}:80"

# A proposito SIN nombre explicito ni STACK_SUFFIX: Docker Compose ya lo
# prefija solo con el nombre del directorio del checkout (ej.
# "horas-extras_horas-extras-db-data" en produccion), que es justo lo que
# separa produccion de staging (dos directorios distintos) sin arriesgar
# apuntar por accidente a un volumen nuevo/vacio. No agregar un "name:" aqui
# ni STACK_SUFFIX - ya paso, y crea un volumen nuevo huerfano en vez de
# reusar el real (ver historial de este archivo).
volumes:
  horas-extras-db-data:
