services:
  db:
    image: postgres:16-alpine
    container_name: horas-extras-db${STACK_SUFFIX:-}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - horas-extras-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports": la base de datos solo es alcanzable dentro de la red
    # interna de este compose, nunca desde fuera del host.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: horas-extras-app${STACK_SUFFIX:-}:latest
    container_name: horas-extras-app${STACK_SUFFIX:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Sin "ports": solo es alcanzable desde "nginx" dentro de la red interna
    # de este compose. El HTTPS publico lo termina nginx (ver mas abajo).

  nginx:
    image: nginx:1.27-alpine
    container_name: horas-extras-nginx${STACK_SUFFIX:-}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - APP_UPSTREAM=app:${PORT:-8090}
    volumes:
      - ./deploy/docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTPS_PORT:-8443}:443"
      - "${NGINX_HTTP_PORT:-8081}:80"

volumes:
  horas-extras-db-data:
    name: horas-extras-db-data${STACK_SUFFIX:-}
